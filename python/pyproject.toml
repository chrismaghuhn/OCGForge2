[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ocgforge"
version = "0.1.0"
description = "Yu-Gi-Oh! policy/value model and PPO training for OCGForge"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.3", "safetensors>=0.4"]

[project.optional-dependencies]
embed = ["transformers>=4.40"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

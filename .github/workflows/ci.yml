name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        preset: [release, asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: .cache
          key: deps-${{ hashFiles('third_party/deps.json', 'third_party/patches/**') }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          OCGFORGE_RANDOM_DUELS: ${{ matrix.preset == 'asan' && '5' || '25' }}
